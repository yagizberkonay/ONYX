<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Onyx</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body {
        display: grid;
        place-items: center;
        background: transparent;
        color: #f1f3f5;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        display: flex;
        width: 300px;
        flex-direction: column;
        align-items: center;
        border: 1px solid rgba(59, 68, 78, .78);
        border-radius: 18px;
        background: rgba(17, 20, 23, .96);
        box-shadow: 0 24px 80px rgba(0, 0, 0, .38), inset 0 1px 0 rgba(255, 255, 255, .035);
        padding: 34px 32px 26px;
      }
      .mark {
        display: grid;
        width: 50px;
        height: 50px;
        place-items: center;
        border: 1px solid #aeb6bf;
        color: #f1f3f5;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -.12em;
        animation: breathe 1.8s ease-in-out infinite;
      }
      .name {
        margin-top: 16px;
        color: #e8ebee;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .28em;
        padding-left: .28em;
      }
      .caption {
        margin-top: 8px;
        color: #737b85;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        font-size: 10px;
        letter-spacing: .04em;
      }
      .track {
        width: 100%;
        height: 2px;
        margin-top: 26px;
        overflow: hidden;
        border-radius: 999px;
        background: #252b32;
      }
      .track span {
        display: block;
        width: 100%;
        height: 100%;
        transform-origin: left center;
        background: #bfc6cd;
        animation: fill 3s linear forwards;
      }
      @keyframes breathe {
        0%, 100% { opacity: .72; transform: scale(.98); }
        50% { opacity: 1; transform: scale(1); }
      }
      @keyframes fill {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .mark { animation: none; }
        .track span { animation-duration: .01ms; }
      }
    </style>
  </head>
  <body>
    <main class="card" aria-label="Onyx loading">
      <div class="mark" aria-hidden="true">O/</div>
      <div class="name">ONYX</div>
      <div class="caption">Local-first API workspace</div>
      <div class="track" aria-hidden="true"><span></span></div>
    </main>
  </body>
</html>
